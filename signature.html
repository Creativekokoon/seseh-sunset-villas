<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <link rel="icon" type="image/png" href="assets/logos/favicon.png">
  <link rel="apple-touch-icon" href="assets/logos/favicon.png">
  <title>Signature — Seseh Sunset Villas</title>
  <link rel="stylesheet" href="https://use.typekit.net/xkb5dqg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/villa.css">
  <style>
    .plan-coming { flex:1; display:flex; align-items:center; justify-content:center; font-family:'Inter','Helvetica Neue',Arial,sans-serif; font-size:0.55rem; letter-spacing:0.22em; text-transform:uppercase; color:rgba(83,78,72,0.38); }
    .features-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; padding:0 16px; }
    .feature-item { font-family:'Inter','Helvetica Neue',Arial,sans-serif; font-size:0.62rem; letter-spacing:0.12em; color:rgba(57,52,47,0.72); padding:6px 0; border-bottom:1px solid rgba(62,58,54,0.08); }
    /* Match plan size with Élégance / Prestige across breakpoints */
    .plan-svg { max-width: 720px; }
    @media (min-width:1024px) and (min-height:900px) {
      .plan-svg { max-width: 760px; }
    }
    /* iPad Pro 13" portrait + landscape — constrain to header width */
    @media (min-width:1024px) and (max-width:1400px) and (min-height:1100px),
           (min-width:1024px) and (max-width:1400px) and (hover:none) {
      .plan-svg { max-width: 520px; }
    }
    /* Labels légèrement plus grands sur desktop pour compenser le viewBox plus haut
       (500x381) qui force le SVG à rétrécir via max-height */
    #f0 .pz-text, #f1 .pz-text { font-size: 16px; }
    /* Sur tablette le SVG n'est pas contraint par la hauteur, donc on revient à 14px
       pour matcher visuellement Élégance / Prestige / Exception */
    @media (max-width:1023px) and (min-width:768px),
           (min-width:1024px) and (max-width:1400px) and (hover:none) {
      #f0 .pz-text, #f1 .pz-text { font-size: 14px; }
    }
    /* ── BOUTON VISITE VIRTUELLE ── */
    .villa-title { position: relative; }
    .vr-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-30%);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 30px 16px 18px;
      background: #fff;
      border: 1px solid rgba(61,57,52,0.2);
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      color: #3d3934;
      transition: all 0.25s ease;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      text-decoration: none;
    }
    .vr-btn:hover {
      background: #3d3934;
      color: #fff;
      border-color: #3d3934;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      transform: translateY(calc(-30% - 1px));
    }
    .vr-btn-icon {
      width: 44px; height: 44px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.4s ease;
    }
    .vr-btn-icon img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: brightness(0);
    }
    .vr-btn:hover .vr-btn-icon { transform: rotate(15deg); }
    .vr-btn:hover .vr-btn-icon img { filter: brightness(0) invert(1); }
    .vr-btn-text { display: flex; flex-direction: column; text-align: left; line-height: 1.2; }
    .vr-btn-label { font-size: 16px; letter-spacing: 0.04em; font-weight: 400; }
    .vr-btn-sub {
      font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
      color: #8a847a; margin-top: 4px;
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
    }
    .vr-btn:hover .vr-btn-sub { color: rgba(255,255,255,0.7); }
    /* ── MODAL VISITE VIRTUELLE ── */
    .vr-modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(14, 11, 8, 0.92);
      z-index: 9000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
      display: flex; align-items: center; justify-content: center;
      padding: 40px;
    }
    .vr-modal-backdrop.visible { opacity: 1; pointer-events: all; }
    .vr-modal-content {
      position: relative;
      width: 100%; max-width: 1400px;
      height: 100%; max-height: 850px;
      background: #1a1815;
      border-radius: 4px; overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.4s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .vr-modal-backdrop.visible .vr-modal-content { transform: scale(1); }
    .vr-modal-header {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 20px 28px;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
      z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .vr-modal-header > * { pointer-events: auto; }
    .vr-modal-title {
      color: rgba(255,255,255,0.95);
      font-family: 'the-seasons', Georgia, serif;
      font-size: 18px; letter-spacing: 0.04em; margin: 0;
    }
    .vr-modal-close {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }
    .vr-modal-close:hover {
      background: rgba(255,255,255,0.22);
      transform: rotate(90deg);
    }
    .vr-modal-iframe {
      width: 100%; height: 100%;
      border: 0;
      background: #1a1815;
    }
    @media (max-width: 900px) {
      .vr-btn { padding: 10px; gap: 0; }
      .vr-btn-icon { width: 32px; height: 32px; }
      .vr-btn-text { display: none; }
    }
  </style>
</head>

  <!-- MODAL VISITE VIRTUELLE -->
  <div class="vr-modal-backdrop" id="vrModal" onclick="if(event.target===this)closeVR()">
    <div class="vr-modal-content">
      <div class="vr-modal-header">
        <div class="vr-modal-title">Villa Signature · Visite Virtuelle</div>
        <button class="vr-modal-close" onclick="closeVR()" aria-label="Fermer">×</button>
      </div>
      <iframe class="vr-modal-iframe" id="vrFrame" src="" allow="xr-spatial-tracking; fullscreen" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const tip = document.getElementById('tip');
    document.addEventListener('mousemove', e => { tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; });
    document.querySelectorAll('.pzone').forEach(z => {
      z.addEventListener('mouseenter', () => tip.classList.add('visible'));
      z.addEventListener('mouseleave', () => tip.classList.remove('visible'));
    });
    const roomImg = document.getElementById('roomImg');
    const visuals = document.querySelectorAll('.room-visual');
    function hideAllVisuals() { visuals.forEach(v => v.classList.remove('visible')); }
    function clearSelections() { document.querySelectorAll('.pzone').forEach(z => z.classList.remove('selected')); }
    function pick(id, zone) {
      clearSelections(); zone.classList.add('selected');
      hideAllVisuals();
      const v = document.getElementById('visual-' + id);
      if (v) { roomImg.classList.remove('empty'); v.classList.add('visible'); }
    }
    function setFloor(idx, btn) {
      document.querySelectorAll('.floor-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('f0').style.display = idx===0?'block':'none';
      document.getElementById('f1').style.display = idx===1?'block':'none';
      clearSelections(); hideAllVisuals(); roomImg.classList.add('empty');
    }

    // ── VISITE VIRTUELLE ──
    const VR_URL = 'https://showreel.d5render.com/personal-krpano?directory=https://usa.asset.d5cdn.com/tourProject/pano_roam_1777574131850_3226536/&tourId=2049931858475671553';
    function openVR() {
      window.open(VR_URL, '_blank', 'noopener,noreferrer');
    }
    function closeVR() {
      const modal = document.getElementById('vrModal');
      const frame = document.getElementById('vrFrame');
      modal.classList.remove('visible');
      frame.src = '';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('vrModal').classList.contains('visible')) closeVR();
    });
  </script>
