<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Prestige — Seseh Sunset Villas</title>
  <link rel="stylesheet" href="https://use.typekit.net/xkb5dqg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/prestige.css">
  <style>
    .plan-svg { max-width: 720px; }
    @media (min-width:1024px) and (min-height:900px) {
      .plan-svg { max-width: 760px; }
    }
    /* iPad Pro 13" (portrait + landscape) — constrain SVG to header width */
    @media (min-width:1024px) and (max-width:1400px) and (min-height:1100px),
           (min-width:1024px) and (max-width:1400px) and (hover:none) {
      .plan-svg { max-width: 520px; }
    }
    /* Match interactive labels with the Escalier label (14px) — same as Élégance */
    #f0 .pz-text, #f1 .pz-text { font-size: 14px; }
    /* ── BOUTON VISITE VIRTUELLE ── */
    .villa-title { position: relative; }
    .vr-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-30%);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 30px 16px 18px;
      background: #fff;
      border: 1px solid rgba(61,57,52,0.2);
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      color: #3d3934;
      transition: all 0.25s ease;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      text-decoration: none;
    }
    .vr-btn:hover {
      background: #3d3934;
      color: #fff;
      border-color: #3d3934;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      transform: translateY(calc(-30% - 1px));
    }
    .vr-btn-icon {
      width: 44px; height: 44px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.4s ease;
    }
    .vr-btn-icon img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: brightness(0);
    }
    .vr-btn:hover .vr-btn-icon { transform: rotate(15deg); }
    .vr-btn:hover .vr-btn-icon img { filter: brightness(0) invert(1); }
    .vr-btn-text { display: flex; flex-direction: column; text-align: left; line-height: 1.2; }
    .vr-btn-label { font-size: 16px; letter-spacing: 0.04em; font-weight: 400; }
    .vr-btn-sub {
      font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
      color: #8a847a; margin-top: 4px;
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
    }
    .vr-btn:hover .vr-btn-sub { color: rgba(255,255,255,0.7); }
    /* ── MODAL VISITE VIRTUELLE ── */
    .vr-modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(14, 11, 8, 0.92);
      z-index: 9000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
      display: flex; align-items: center; justify-content: center;
      padding: 40px;
    }
    .vr-modal-backdrop.visible { opacity: 1; pointer-events: all; }
    .vr-modal-content {
      position: relative;
      width: 100%; max-width: 1400px;
      height: 100%; max-height: 850px;
      background: #1a1815;
      border-radius: 4px; overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.4s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .vr-modal-backdrop.visible .vr-modal-content { transform: scale(1); }
    .vr-modal-header {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 20px 28px;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
      z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .vr-modal-header > * { pointer-events: auto; }
    .vr-modal-title {
      color: rgba(255,255,255,0.95);
      font-family: 'the-seasons', Georgia, serif;
      font-size: 18px; letter-spacing: 0.04em; margin: 0;
    }
    .vr-modal-close {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }
    .vr-modal-close:hover {
      background: rgba(255,255,255,0.22);
      transform: rotate(90deg);
    }
    .vr-modal-iframe {
      width: 100%; height: 100%;
      border: 0;
      background: #1a1815;
    }
    @media (max-width: 900px) {
      .vr-btn { padding: 10px; gap: 0; }
      .vr-btn-icon { width: 32px; height: 32px; }
      .vr-btn-text { display: none; }
    }
  </style>
</head>
<body>

  <div class="page-intro"></div>

          <div class="room-visual" id="visual-pool">
            <div class="scene-card"><div class="room-scene">
              <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
                <defs>
                  <linearGradient id="poolBg" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0%" stop-color="#ded7cb"/><stop offset="100%" stop-color="#b7aea2"/></linearGradient>
                  <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d2dbdc"/><stop offset="55%" stop-color="#b3c0c2"/><stop offset="100%" stop-color="#96a4a8"/></linearGradient>
                </defs>
                <rect width="800" height="600" fill="url(#poolBg)"/>
